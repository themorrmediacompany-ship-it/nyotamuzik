<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="description" content="NYOTA Frequency Machine: awaken the five masks and shape the sound of Nyota.">
<title>NYOTA | Frequency Machine</title>
<link rel="canonical" href="https://nyotamuzik.com/Frequency.dc.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="NYOTA">
<meta property="og:title" content="NYOTA | Frequency Machine">
<meta property="og:description" content="Five energies. One instrument. Play the Nyota Frequency Machine.">
<meta property="og:image" content="https://nyotamuzik.com/assets/icon-social.png">
<link rel="icon" type="image/png" href="assets/icon-social.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #030302; color: #f7f2e8; overflow: hidden; -webkit-user-select: none; user-select: none; }
a { color: #d4a437; text-decoration: none; }
a:hover { color: #e8c56a; }
button { font-family: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 1px solid rgba(212,164,55,.8); outline-offset: 3px; }
@keyframes nfmFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes nfmUp { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
@keyframes nfmBlink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
@keyframes nfmSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes nfmTap { 0% { transform: translate(-50%,-50%) scale(.55); opacity: .9; } 70% { transform: translate(-50%,-50%) scale(1.35); opacity: 0; } 100% { transform: translate(-50%,-50%) scale(1.35); opacity: 0; } }
@keyframes nfmDragY { 0%, 100% { transform: translateY(20px); } 50% { transform: translateY(-20px); } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01s !important; } }
</style>
</helmet>
<div ref="{{ stageRef }}" style="position:fixed;inset:0;background:radial-gradient(ellipse 90% 75% at 50% 38%, #0b0906, #030302 74%);font-family:Inter,sans-serif;overflow:hidden">
  
  
      

  <div style="position:absolute;inset:0;animation:nfmFade .9s ease both">

    <div style="position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px clamp(16px,4vw,40px)">
      <div style="display:flex;align-items:center;gap:10px">
        <a href="Nyota.dc.html" style="font-family:Cinzel,serif;font-size:13px;letter-spacing:.36em;color:rgba(247,242,232,.65);transition:color .4s ease" style-hover="color:#d4a437">← NYOTA</a>
        <button onClick="{{ tourOpen }}" aria-label="Replay the guided tour" style="width:26px;height:26px;border-radius:50%;border:1px solid rgba(212,164,55,.35);background:transparent;color:rgba(212,164,55,.75);font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;padding:0" style-hover="border-color:rgba(212,164,55,.7);color:#e8c56a">?</button>
      </div>
      <div tabIndex="0" onPointerDown="{{ bpmDrag }}" onWheel="{{ bpmWheel }}" onKeyDown="{{ bpmKey }}" role="slider" aria-label="Tempo" aria-valuenow="{{ bpm }}" style="text-align:center;cursor:ns-resize;touch-action:none;padding:4px 10px">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.06em;color:#f3e2b3;text-shadow:0 0 12px rgba(212,164,55,.4)">{{ bpm }}</div>
        <div style="font-size:8px;letter-spacing:.4em;color:rgba(247,242,232,.4)">BPM</div>
      </div>
    </div>

    <div ref="{{ fieldRef }}" style="position:absolute;left:0;right:0;top:60px;bottom:{{ fieldBot }}">
    <canvas ref="{{ fxRef }}" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
    <button ref="{{ coreRef }}" onClick="{{ coreTap }}" aria-label="{{ coreAria }}" style="position:absolute;left:50%;top:{{ coreTop }};transform:translate(-50%,-50%);z-index:20;width:{{ coreSize }};height:{{ coreSize }};border-radius:50%;border:none;background:transparent;cursor:pointer;padding:0">
      <span style="position:absolute;inset:-14%;border-radius:50%;background:conic-gradient(from 0deg, rgba(212,164,55,0), rgba(212,164,55,.4), rgba(212,164,55,0) 30%);animation:nfmSpin {{ coreSpinDur }} linear infinite;-webkit-mask:radial-gradient(circle, transparent 66%, #000 67%, #000 68.5%, transparent 69.5%);mask:radial-gradient(circle, transparent 66%, #000 67%, #000 68.5%, transparent 69.5%)"></span>
      <span style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 36% 28%, rgba(255,255,255,.1), rgba(18,14,10,.94) 55%, #0a0806);border:1px solid rgba(212,164,55,.4);box-shadow:inset 0 1px 2px rgba(255,255,255,.14), inset 0 -16px 30px rgba(0,0,0,.7), 0 24px 60px rgba(0,0,0,.7)"></span>
      <span ref="{{ coreGlowRef }}" style="position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle, rgba(212,164,55,.22), rgba(212,164,55,0) 70%)"></span>
      <span style="position:relative;display:flex;flex-direction:column;align-items:center;gap:8px">
        <img src="assets/logo-gold.png" alt="" style="width:38%;opacity:.95;filter:drop-shadow(0 0 12px rgba(212,164,55,.5))"></img>
        <span style="font-family:Cinzel,serif;font-size:clamp(11px,1.2vw,13px);letter-spacing:.34em;color:#e8c56a">{{ coreLabel }}</span>
      </span>
    </button>

    <sc-for list="{{ maskViews }}" as="m" hint-placeholder-count="0">
      <div style="position:absolute;left:{{ m.left }};top:{{ m.top }};transform:translate(-50%,-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:16px">
        <button onClick="{{ m.tap }}" aria-label="{{ m.aria }}" aria-pressed="{{ m.pressed }}" style="position:relative;width:{{ m.size }};height:{{ m.size }};border-radius:50%;background:radial-gradient(circle at 36% 28%, rgba(255,255,255,.08), rgba(16,13,10,.94) 58%, #090705);border:1px solid {{ m.border }};cursor:pointer;padding:0;display:block;box-shadow:inset 0 1px 2px rgba(255,255,255,.1), inset 0 -10px 22px rgba(0,0,0,.6), 0 18px 40px rgba(0,0,0,.6);transition:border-color .8s ease, transform .3s ease" style-hover="transform:scale(1.05)" style-active="transform:scale(.95)">
          <span ref="{{ m.ringRef }}" style="position:absolute;inset:-6%;border-radius:50%;pointer-events:none"></span>
          <svg viewBox="0 0 24 24" style="position:absolute;inset:24%;width:52%;height:52%;color:{{ m.glyphColor }};opacity:{{ m.imgOp }};transition:color 1s ease, opacity 1s ease;pointer-events:none"><path d="{{ m.sigil }}" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{ m.sigilFill }}" fill="currentColor"></path></svg>
          <span style="position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);width:14px;height:3px;background:{{ m.dot }};box-shadow:{{ m.dotGlow }};transition:all .6s ease;border:1px solid rgba(0,0,0,.6)"></span>
        </button>
        <span style="font-family:Cinzel,serif;font-size:clamp(10px,1.2vw,12px);letter-spacing:.32em;color:{{ m.nameColor }};transition:color .8s ease;text-shadow:0 0 12px {{ m.nameGlow }};pointer-events:none">{{ m.name }}</span>
      </div>
    </sc-for>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:{{ hintBot }};z-index:29;text-align:center;pointer-events:none;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.28em;color:{{ hintColor }};transition:color .3s ease">{{ hintText }}</div>
    <div ref="{{ consoleRef }}" style="position:absolute;left:0;right:0;bottom:0;z-index:30;border-top:1px solid rgba(212,164,55,.16);background:linear-gradient(180deg,rgba(11,9,6,.92),rgba(4,3,2,.97));backdrop-filter:blur(10px);padding:{{ conPadV }} clamp(12px,3vw,28px) calc({{ conPadV }} + env(safe-area-inset-bottom))">
      <div style="max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:{{ conGap }}">
        <div style="display:{{ riteRowDisp }};align-items:center;justify-content:space-between;gap:6px">
          <button onClick="{{ fieldTap }}" aria-pressed="{{ fieldOn }}" style="padding:8px 10px;border-radius:999px;border:1px solid {{ fieldBorder }};background:{{ fieldBg }};color:{{ fieldColor }};font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.14em;cursor:pointer;transition:all .4s ease" style-active="transform:translateY(1px)">BALANCE</button>
          <div style="display:flex;align-items:center;gap:0">
            <button onClick="{{ patchPrev }}" aria-label="Previous rite" style="border:none;border-radius:999px;background:transparent;color:rgba(212,164,55,.55);cursor:pointer;font-size:10px;padding:4px 8px" style-active="transform:translateX(-1px)">◂</button>
            <span style="font-family:Cinzel,serif;font-size:10px;letter-spacing:.18em;color:#e8c56a;white-space:nowrap">{{ patchName }}</span>
            <button onClick="{{ patchNext }}" aria-label="Next rite" style="border:none;border-radius:999px;background:transparent;color:rgba(212,164,55,.55);cursor:pointer;font-size:10px;padding:4px 8px" style-active="transform:translateX(1px)">▸</button>
          </div>
          <button onClick="{{ padsTap }}" aria-pressed="{{ padsOn }}" style="padding:8px 10px;border-radius:999px;border:1px solid {{ padsBorder }};background:{{ padsBg }};color:{{ padsColor }};font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.14em;cursor:pointer;transition:all .4s ease" style-active="transform:translateY(1px)">PADS</button>
        </div>
        <div style="display:flex;gap:2px">
          <sc-for list="{{ ledCells }}" as="led" hint-placeholder-count="16">
            <span ref="{{ led.ref }}" style="flex:1;height:3px;background:rgba(247,242,232,.09);margin-right:{{ led.gap }}"></span>
          </sc-for>
        </div>
        <div style="display:flex;align-items:stretch;justify-content:center;gap:clamp(10px,2.2vw,18px)">
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px">
            <button onClick="{{ transportTap }}" aria-label="{{ coreAria }}" style="width:{{ tBtn }};height:{{ tBtn }};border-radius:50%;border:1px solid rgba(212,164,55,.5);background:linear-gradient(180deg,rgba(212,164,55,.13),rgba(212,164,55,.03));color:#e8c56a;font-size:13px;cursor:pointer;padding:0" style-active="transform:translateY(1px)">{{ playGlyph }}</button>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:7px;letter-spacing:.26em;color:rgba(247,242,232,.4)">{{ playWord }}</span>
          </div>
          <span style="width:1px;background:rgba(247,242,232,.08);display:{{ divDisp }}"></span>
          <div style="display:flex;gap:clamp(8px,1.8vw,15px)">
            <sc-for list="{{ chanViews }}" as="c" hint-placeholder-count="5">
              <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
                <div style="display:flex;align-items:flex-end;gap:2px">
                  <span style="width:4px"></span>
                  <div tabIndex="0" role="slider" aria-label="{{ c.ariaFader }}" aria-valuenow="{{ c.pct }}" onPointerDown="{{ c.down }}" onWheel="{{ c.wheel }}" onKeyDown="{{ c.key }}" style="position:relative;width:20px;height:{{ faderH }};background:linear-gradient(180deg,#14110d,#0a0806);border:1px solid rgba(255,255,255,.1);cursor:ns-resize;touch-action:none">
                    <div style="position:absolute;left:0;right:0;bottom:0;height:{{ c.fill }};background:{{ c.fillBg }}"></div>
                    <div style="position:absolute;left:-3px;right:-3px;bottom:{{ c.fill }};height:3px;margin-bottom:-2px;background:#e8d9b0;box-shadow:0 1px 3px rgba(0,0,0,.8)"></div>
                  </div>
                  <div style="width:4px;height:{{ faderH }};background:#0a0806;border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden">
                    <div ref="{{ c.vuRef }}" style="position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(180deg,#e8c56a,{{ c.accent }})"></div>
                  </div>
                </div>
                <button onClick="{{ c.muteTap }}" aria-label="{{ c.muteAria }}" aria-pressed="{{ c.muted }}" style="width:26px;height:11px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:{{ c.muteBg }};box-shadow:{{ c.muteGlow }};cursor:pointer;padding:0;transition:all .3s ease"></button>
                <button onClick="{{ c.openTap }}" style="border:none;border-radius:999px;background:transparent;color:{{ c.labelColor }};font-family:'IBM Plex Mono',monospace;font-size:7px;letter-spacing:.14em;cursor:pointer;padding:2px 1px;transition:color .4s ease">{{ c.name }}</button>
              </div>
            </sc-for>
          </div>
          <span style="width:1px;background:rgba(247,242,232,.08);display:{{ divDisp }}"></span>
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px">
            <div tabIndex="0" role="slider" aria-label="Eclipse master effect" aria-valuenow="{{ eclPct }}" onPointerDown="{{ eclDown }}" onDoubleClick="{{ eclReset }}" onWheel="{{ eclWheel }}" onKeyDown="{{ eclKey }}" ref="{{ eclKnobRef }}" style="position:relative;width:52px;height:52px;border-radius:50%;cursor:ns-resize;touch-action:none;background:{{ eclArc }}">
              <div style="position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 36% 28%, #26221c, #0a0806 72%);border:1px solid rgba(212,164,55,.3);box-shadow:inset 0 1px 1px rgba(255,255,255,.12), inset 0 -6px 12px rgba(0,0,0,.8), 0 8px 18px rgba(0,0,0,.7)"></div>
              <div style="position:absolute;inset:5px;border-radius:50%;transform:rotate({{ eclRot }}deg)"><div style="position:absolute;left:50%;top:9%;width:3px;height:24%;margin-left:-1.5px;border-radius:2px;background:#e8c56a;box-shadow:0 0 8px rgba(212,164,55,.8)"></div></div>
            </div>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:7px;letter-spacing:.26em;color:rgba(212,164,55,.75)">ECLIPSE</span>
          </div>
          <span style="width:1px;background:rgba(247,242,232,.08);display:{{ riteDisp }}"></span>
          <div style="display:{{ riteDisp }};flex-direction:column;align-items:center;justify-content:center;gap:3px">
            <div style="display:flex;align-items:center;gap:2px">
              <button onClick="{{ patchPrev }}" aria-label="Previous rite" style="border:none;border-radius:999px;background:transparent;color:rgba(212,164,55,.55);cursor:pointer;font-size:11px;padding:6px 10px;transition:color .3s ease" style-hover="color:#e8c56a" style-active="transform:translateX(-1px)">◂</button>
              <div style="font-family:Cinzel,serif;font-size:11px;letter-spacing:.2em;color:#e8c56a;white-space:nowrap">{{ patchName }}</div>
              <button onClick="{{ patchNext }}" aria-label="Next rite" style="border:none;border-radius:999px;background:transparent;color:rgba(212,164,55,.55);cursor:pointer;font-size:11px;padding:6px 10px;transition:color .3s ease" style-hover="color:#e8c56a" style-active="transform:translateX(1px)">▸</button>
            </div>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:7px;letter-spacing:.26em;color:rgba(247,242,232,.35)">RITE {{ patchNum }}</span>
          </div>
          <span style="width:1px;background:rgba(247,242,232,.08);display:{{ divDisp }}"></span>
          <div style="display:{{ bpColDisp }};flex-direction:column;justify-content:center;gap:6px">
            <button onClick="{{ fieldTap }}" aria-pressed="{{ fieldOn }}" style="padding:9px 16px;border-radius:999px;border:1px solid {{ fieldBorder }};background:{{ fieldBg }};color:{{ fieldColor }};font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.22em;cursor:pointer;transition:all .4s ease" style-active="transform:translateY(1px)">BALANCE</button>
            <button onClick="{{ padsTap }}" aria-pressed="{{ padsOn }}" ref="{{ padsBtnRef }}" style="padding:9px 16px;border-radius:999px;border:1px solid {{ padsBorder }};background:{{ padsBg }};color:{{ padsColor }};font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.22em;cursor:pointer;transition:all .4s ease" style-active="transform:translateY(1px)">PADS</button>
          </div>
        </div>
      </div>
    </div>

    <sc-if value="{{ drawerOn }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none">
        <div style="pointer-events:auto;width:min(820px,100vw);max-height:min(62dvh,520px);overflow-y:auto;border-radius:18px 18px 0 0;border:1px solid rgba(212,164,55,.28);border-bottom:none;border-left:none;border-right:none;background:linear-gradient(180deg,rgba(22,18,13,.97),rgba(8,6,4,.98));backdrop-filter:blur(16px);box-shadow:0 -24px 70px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.08);padding:18px clamp(16px,3vw,28px) calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;animation:nfmUp .35s cubic-bezier(.2,.8,.2,1) both">
          <div style="display:flex;align-items:center;gap:12px">
            <svg viewBox="0 0 24 24" style="width:24px;height:24px;color:{{ dAccent }};display:{{ dSigilDisp }}"><path d="{{ dSigilPath }}" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{ dSigilFill }}" fill="currentColor"></path></svg>
            <span style="font-family:Cinzel,serif;font-size:15px;letter-spacing:.3em;color:{{ dAccent }}">{{ dTitle }}</span>
            <span style="flex:1"></span>
            <sc-if value="{{ dIsEngine }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ dSilence }}" style="padding:10px 18px;border-radius:999px;border:1px solid rgba(247,242,232,.2);background:transparent;color:rgba(247,242,232,.6);font-family:Cinzel,serif;font-size:10px;letter-spacing:.26em;cursor:pointer" style-hover="border-color:rgba(212,164,55,.5);color:#e8c56a">REST THIS MASK</button>
            </sc-if>
            <button onClick="{{ dClose }}" aria-label="Close" style="width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(10,8,6,.7);color:rgba(247,242,232,.7);cursor:pointer;font-size:13px" style-active="transform:scale(.94)">✕</button>
          </div>

          <sc-if value="{{ dIsEngine }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-wrap:wrap;gap:8px">
              <sc-for list="{{ waveOpts }}" as="w" hint-placeholder-count="0">
                <button onClick="{{ w.pick }}" aria-pressed="{{ w.on }}" style="padding:11px 18px;border-radius:999px;border:1px solid {{ w.border }};background:{{ w.bg }};color:{{ w.color }};font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;cursor:pointer;transition:all .3s ease" style-active="transform:translateY(1px)">{{ w.name }}</button>
              </sc-for>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:16px clamp(16px,3vw,30px);justify-content:center">
              <sc-for list="{{ dKnobs }}" as="k" hint-placeholder-count="0">
                <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
                  <div tabIndex="0" role="slider" aria-label="{{ k.label }}" aria-valuenow="{{ k.pct }}" onPointerDown="{{ k.down }}" onDoubleClick="{{ k.reset }}" onWheel="{{ k.wheel }}" onKeyDown="{{ k.key }}" style="position:relative;width:{{ k.d }};height:{{ k.d }};border-radius:50%;cursor:ns-resize;touch-action:none;background:{{ k.arc }}">
                    <div style="position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 36% 28%, #26221c, #0d0b09 70%);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 1px rgba(255,255,255,.12), inset 0 -5px 10px rgba(0,0,0,.7), 0 6px 14px rgba(0,0,0,.6)"></div>
                    <div style="position:absolute;inset:6px;border-radius:50%;transform:rotate({{ k.rot }}deg)"><div style="position:absolute;left:50%;top:9%;width:3px;height:25%;margin-left:-1.5px;border-radius:2px;background:{{ k.ind }};box-shadow:0 0 7px {{ k.ind }}"></div></div>
                  </div>
                  <span style="font-size:10px;letter-spacing:.26em;color:rgba(247,242,232,.6)">{{ k.label }}</span>
                </div>
              </sc-for>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px">
              <div style="display:flex;align-items:center;gap:10px">
                <span style="font-size:9px;letter-spacing:.34em;color:rgba(247,242,232,.4)">PATTERN</span>
                <span style="flex:1"></span>
                <sc-for list="{{ lenOpts }}" as="l" hint-placeholder-count="0">
                  <button onClick="{{ l.pick }}" aria-pressed="{{ l.on }}" style="padding:7px 12px;border-radius:999px;border:1px solid {{ l.border }};background:{{ l.bg }};color:{{ l.color }};font-family:'IBM Plex Mono',monospace;font-size:10px;cursor:pointer" style-active="transform:translateY(1px)">{{ l.name }}</button>
                </sc-for>
              </div>
              <sc-for list="{{ seqRows }}" as="row" hint-placeholder-count="1">
                <div style="display:flex;align-items:center;gap:8px">
                  <span style="width:52px;font-size:9px;letter-spacing:.2em;color:rgba(247,242,232,.5);font-family:'IBM Plex Mono',monospace">{{ row.label }}</span>
                  <div style="display:flex;gap:5px;flex:1">
                    <sc-for list="{{ row.steps }}" as="s" hint-placeholder-count="16">
                      <button onClick="{{ s.tap }}" aria-label="{{ s.aria }}" aria-pressed="{{ s.on }}" style="flex:1;height:34px;min-width:0;border-radius:6px;border:1px solid {{ s.border }};background:{{ s.bg }};box-shadow:{{ s.glow }};cursor:pointer;margin-right:{{ s.gap }};transition:background .15s ease, box-shadow .15s ease;padding:0" style-active="transform:translateY(1px)"></button>
                    </sc-for>
                  </div>
                </div>
              </sc-for>
            </div>
          </sc-if>

          <sc-if value="{{ dIsPads }}" hint-placeholder-val="{{ false }}">
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
              <sc-for list="{{ pads }}" as="p" hint-placeholder-count="8">
                <button onPointerDown="{{ p.hit }}" aria-label="{{ p.aria }}" style="min-height:64px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,#1a1713,#0d0b09);box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 -3px 6px rgba(0,0,0,.6), 0 5px 12px rgba(0,0,0,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:box-shadow .1s ease" style-active="transform:translateY(2px);box-shadow:inset 0 2px 8px rgba(0,0,0,.8), 0 0 20px rgba(212,164,55,.3)">

  renderVals() {
    const S = this.state, nfm = this._nfm;
    const ids = ['solar', 'lunar', 'rhythm', 'ancestor', 'eclipse'];
    const layout = S.narrow
      ? { solar: [50, 12], lunar: [15, 32], rhythm: [85, 32], ancestor: [20, 76], eclipse: [80, 76] }
      : { solar: [50, 13], lunar: [25, 34], rhythm: [75, 34], ancestor: [30, 78], eclipse: [70, 78] };
    this._pos = {};
    const maskViews = ids.map(id => {
      const acc = this.ACCENTS[id];
      const muted = nfm ? nfm.params[id].mute : true;
      this._pos[id] = { x: layout[id][0], y: layout[id][1] };
      return {
        name: id.toUpperCase(),
        left: layout[id][0] + '%', top: layout[id][1] + '%',
        size: S.narrow ? 'clamp(56px,16vw,74px)' : 'clamp(56px,12.5vh,92px)',
        tap: () => this.tapMask(id),
        aria: muted ? 'Awaken ' + id : 'Enter the ' + id + ' chamber',
        pressed: muted ? 'false' : 'true',
        border: muted ? 'rgba(255,255,255,.1)' : acc + '77',
        ringRef: el => { this._rings[id] = el; },
        sigil: this.SIGILS[id],
        sigilFill: this.SIGIL_FILLS[id],
        glyphColor: muted ? 'rgba(247,242,232,.35)' : acc,
        imgOp: muted ? 0.55 : 1,
        dot: muted ? 'rgba(247,242,232,.14)' : acc,
        dotGlow: muted ? 'none' : '0 0 10px ' + acc,
        nameColor: muted ? 'rgba(247,242,232,.4)' : acc,
        nameGlow: muted ? 'transparent' : acc + '44'
      };
    });
    const ledCells = Array.from({ length: 16 }, (_, i) => ({ ref: el => { this._leds[i] = el; }, gap: i % 4 === 3 && i < 15 ? '7px' : '0' }));
    const chanViews = ids.map(id => {
      const acc2 = this.ACCENTS[id];
      const cm = nfm ? nfm.params[id].mute : true;
      const lvl = nfm ? nfm.params[id].level : 0.7;
      const setL = v => { nfm && nfm.setParam(id, 'level', v); this.setState({ tick: this.state.tick + 1 }); };
      return {
        name: id.toUpperCase(), accent: acc2,
        pct: Math.round(lvl * 100), fill: Math.round(lvl * 100) + '%',
        fillBg: 'linear-gradient(180deg,' + acc2 + '88,' + acc2 + '22)',
        ariaFader: id + ' level',
        down: this.bindDrag(() => (nfm ? nfm.params[id].level : 0.7), setL, id.toUpperCase() + ' LEVEL', v => Math.round(v * 100) + '%'),
        wheel: e => { e.preventDefault(); nfm && setL(Math.max(0, Math.min(1, nfm.params[id].level + (e.deltaY < 0 ? 0.03 : -0.03)))); },
        key: e => { if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && nfm) { e.preventDefault(); setL(Math.max(0, Math.min(1, nfm.params[id].level + (e.key === 'ArrowUp' ? 0.03 : -0.03)))); } },
        vuRef: el => { this._vu[id] = el; },
        muted: cm ? 'true' : 'false',
        muteAria: (cm ? 'Awaken ' : 'Rest ') + id,
        muteTap: async () => { const n2 = await this.ensureAudio(); n2.setParam(id, 'mute', !n2.params[id].mute); if (!n2.isPlaying()) this.togglePlay(); else this.setState({ tick: this.state.tick + 1 }); },
        muteBg: cm ? 'rgba(247,242,232,.05)' : acc2,
        muteGlow: cm ? 'none' : '0 0 10px ' + acc2 + '88',
        openTap: () => this.setState({ drawer: S.drawer === id ? null : id }),
        labelColor: cm ? 'rgba(247,242,232,.35)' : acc2
      };
    });
    const drawer = S.drawer, isEng = drawer && ids.includes(drawer);
    const acc = isEng ? this.ACCENTS[drawer] : '#d4a437';
    let waveOpts = [], dKnobs = [], seqRows = [], lenOpts = [], pads = [];
    if (isEng && nfm) {
      const p = nfm.params[drawer];
      const hz = v => { const f = 60 * Math.pow(300, v); return f >= 1000 ? (f / 1000).toFixed(1) + 'k' : Math.round(f) + ''; };
      dKnobs = [
        this.knob(drawer, 'cutoff', 'BRIGHTNESS', hz, 0.72),
        this.knob(drawer, 'res', 'EDGE', null, 0.2),
        this.knob(drawer, 'drive', 'HEAT', null, 0.1),
        this.knob(drawer, 'sendA', 'SPACE', null, 0.3),
        this.knob(drawer, 'sendB', 'ECHO', null, 0.2),
        this.knob(drawer, 'level', 'LEVEL', null, 0.7)
      ];
      const waves = ['sine', 'triangle', 'sawtooth', 'square'];
      const wl = { sine: 'PURE', triangle: 'SOFT', sawtooth: 'RAW', square: 'HOLLOW' };
      waveOpts = drawer === 'rhythm' || drawer === 'ancestor' ? [] : waves.map(w => ({
        name: wl[w], pick: () => { nfm.setParam(drawer, 'wave', w); this.setState({ tick: S.tick + 1 }); },
        on: p.wave === w ? 'true' : 'false',
        border: p.wave === w ? acc + '77' : 'rgba(255,255,255,.12)',
        bg: p.wave === w ? 'rgba(212,164,55,.1)' : 'transparent',
        color: p.wave === w ? acc : 'rgba(247,242,232,.5)'
      }));
      const seq = nfm.seq[drawer];
      const laneNames = drawer === 'rhythm' && this._mod ? this._mod.RHYTHM_LANES : ['STEPS'];
      const cur = S.playing ? (this._step || 0) % seq.length : -1;
      seqRows = seq.lanes.map((lane, li) => ({
        label: laneNames[li] || 'STEPS',
        steps: lane.map((on, i) => {
          const inLen = i < seq.length;
          return {
            tap: () => { nfm.toggleStep(drawer, li, i); this.setState({ tick: S.tick + 1 }); },
            aria: (laneNames[li] || 'step') + ' ' + (i + 1), on: on ? 'true' : 'false',
            gap: i % 4 === 3 && i < 15 ? '7px' : '0',
            border: on ? acc + '88' : 'rgba(255,255,255,.09)',
            bg: !inLen ? 'rgba(0,0,0,.45)' : on ? 'linear-gradient(180deg,' + acc + '66,' + acc + '26)' : 'linear-gradient(180deg,#14110e,#0a0806)',
            glow: i === cur && inLen ? '0 0 10px ' + acc + '55, inset 0 1px 0 rgba(255,255,255,.1)' : 'inset 0 1px 0 rgba(255,255,255,.05)'
          };
        })
      }));
      lenOpts = [4, 8, 12, 16].map(n => ({
        name: n + '', pick: () => { nfm.setSeqLength(drawer, n); this.setState({ tick: S.tick + 1 }); },
        on: seq.length === n ? 'true' : 'false',
        border: seq.length === n ? acc + '77' : 'rgba(255,255,255,.12)',
        bg: seq.length === n ? 'rgba(212,164,55,.1)' : 'transparent',
        color: seq.length === n ? acc : 'rgba(247,242,232,.45)'
      }));
    }
    if (drawer === 'pads' && this._mod) {
      pads = this._mod.PAD_DEFS.map((p, i) => ({
        label: p.label, aria: 'Pad ' + p.label,
        hit: () => this.hitPad(i),
        ledRef: el => { this._pads[i] = el; }
      }));
    }
    const xyDown = e => {
      e.preventDefault();
      const el = this._xy; if (!el) return;
      const mv = ev => {
        const r = el.getBoundingClientRect();
        const x = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
        const y = Math.max(0, Math.min(1, (ev.clientY - r.top) / r.height));
        if (this._xyDot) { this._xyDot.style.left = (x * 100) + '%'; this._xyDot.style.top = (y * 100) + '%'; }
        nfm && nfm.setXY(x, 1 - y);
      };
      mv(e);
      const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
      addEventListener('pointermove', mv); addEventListener('pointerup', up);
    };
    const pill = on => ({
      border: on ? 'rgba(212,164,55,.65)' : 'rgba(247,242,232,.2)',
      bg: on ? 'rgba(212,164,55,.12)' : 'rgba(10,8,6,.5)',
      color: on ? '#e8c56a' : 'rgba(247,242,232,.6)'
    });
    const fp = pill(drawer === 'field'), pp = pill(drawer === 'pads');
    return {
      stageRef: el => { this._stage = el; }, fxRef: el => { this._fx = el; },
      fieldRef: el => { this._field = el; },
      consoleRef: el => { if (el && el !== this._console) { this._console = el; if (this._ro) { this._ro.disconnect(); this._ro.observe(el); } } },
      fieldBot: S.consoleH + 'px',
      patchNum: S.patch.num, patchName: S.patch.name,
      riteDisp: S.narrow ? 'none' : 'flex',
      riteRowDisp: S.narrow ? 'flex' : 'none',
      conPadV: S.narrow ? '5px' : '8px',
      divDisp: S.narrow ? 'none' : 'block',
      bpColDisp: S.narrow ? 'none' : 'flex',
      conGap: S.narrow ? '6px' : '9px',
      faderH: S.narrow ? '42px' : '52px',
      tBtn: S.narrow ? '38px' : '44px',
      patchPrev: () => this.loadPatch(-1), patchNext: () => this.loadPatch(1),
      bpm: S.bpm,
      bpmDrag: this.bindDrag(() => (S.bpm - 90) / 60, v => { const b = Math.round(90 + v * 60); nfm && nfm.setBpm(b); this.setState({ bpm: b }); }, 'BPM', v => Math.round(90 + v * 60) + ''),
      bpmWheel: e => { e.preventDefault(); const b = Math.max(90, Math.min(150, S.bpm + (e.deltaY < 0 ? 1 : -1))); nfm && nfm.setBpm(b); this.setState({ bpm: b }); },
      bpmKey: e => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); const b = Math.max(90, Math.min(150, S.bpm + (e.key === 'ArrowUp' ? 1 : -1))); nfm && nfm.setBpm(b); this.setState({ bpm: b }); } },
      coreRef: el => { this._core = el; }, coreGlowRef: el => { this._coreGlow = el; },
      coreTap: () => this.togglePlay(),
      coreAria: S.playing ? 'Pause the ritual' : 'Begin the ritual',
      coreTop: this.coreTopPct() + '%',
      coreSize: S.narrow ? 'clamp(108px,30vw,134px)' : 'clamp(108px,22vh,164px)',
      coreSpinDur: S.playing ? '9s' : '40s',
      coreLabel: S.playing ? 'REST' : 'BEGIN',
      maskViews, ledCells, chanViews,
      transportTap: () => this.togglePlay(),
      playGlyph: S.playing ? '■︎' : '▶︎',
      playWord: S.playing ? 'REST' : 'AWAKEN',
      eclPct: Math.round(S.eclipse * 100),
      eclArc: this.arc(S.eclipse, '#e8c56a'), eclRot: -135 + S.eclipse * 270,
      eclDown: this.bindDrag(() => this.state.eclipse, v => this.setEclipse(v), 'ECLIPSE', v => Math.round(v * 100) + '%'),
      eclReset: () => this.setEclipse(0),
      eclWheel: e => { e.preventDefault(); this.setEclipse(Math.max(0, Math.min(1, S.eclipse + (e.deltaY < 0 ? 0.04 : -0.04)))); },
      eclKey: e => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); this.setEclipse(Math.max(0, Math.min(1, S.eclipse + (e.key === 'ArrowUp' ? 0.04 : -0.04)))); } },
      fieldTap: () => this.setState({ drawer: drawer === 'field' ? null : 'field' }),
      fieldOn: drawer === 'field' ? 'true' : 'false', fieldBorder: fp.border, fieldBg: fp.bg, fieldColor: fp.color,
      padsTap: () => this.setState({ drawer: drawer === 'pads' ? null : 'pads' }),
      padsOn: drawer === 'pads' ? 'true' : 'false', padsBorder: pp.border, padsBg: pp.bg, padsColor: pp.color,
      hintText: S.drag ? S.drag.label + ' ' + S.drag.text : (S.playing ? 'TOUCH A GLOWING MASK TO ENTER ITS CHAMBER' : 'TOUCH THE GOLD CORE — THE RITUAL IS WAITING'),
      hintColor: S.drag ? '#e8c56a' : 'rgba(247,242,232,.32)',
      hintBot: (S.consoleH + 8) + 'px',
      drawerOn: !!drawer,
      dIsEngine: !!isEng, dIsPads: drawer === 'pads', dIsField: drawer === 'field',
      dTitle: isEng ? drawer.toUpperCase() + ' — ITS CHAMBER' : drawer === 'pads' ? 'THE PADS — STRIKE FREELY' : 'THE FIELD — BALANCE THE ENERGIES',
      dAccent: acc,
      dSigilPath: isEng ? this.SIGILS[drawer] : '',
      dSigilFill: isEng ? this.SIGIL_FILLS[drawer] : '',
      dSigilDisp: isEng ? 'block' : 'none',
      dSilence: () => { if (nfm && isEng) { nfm.setParam(drawer, 'mute', true); this.setState({ drawer: null, tick: S.tick + 1 }); } },
      dClose: () => this.setState({ drawer: null }),
      waveOpts, dKnobs, seqRows, lenOpts, pads,
      xyRef: el => { this._xy = el; }, xyDotRef: el => { this._xyDot = el; }, xyDown,
      ...this.tourVals(),
      eclKnobRef: el => { this._eclKnob = el; },
      padsBtnRef: el => { this._padsBtn = el; }
    };
  }
  tourVals() {
    const S = this.state;
    const step = Math.max(0, S.tour);
    let spot = { x: innerWidth / 2, y: innerHeight / 2, r: 90 };
    if (S.tour >= 0) {
      const tEls = [this._core, this._rings.solar && this._rings.solar.parentElement, this._eclKnob, this._padsBtn];
      const el = tEls[S.tour];
      if (el) { const r = el.getBoundingClientRect(); spot = { x: r.left + r.width / 2, y: r.top + r.height / 2, r: Math.max(r.width, r.height) / 2 + 12 }; }
    }
    const cardW = Math.min(340, innerWidth - 28);
    const cardLeft = Math.max(14, Math.min(spot.x - cardW / 2, innerWidth - 14 - cardW));
    const cardH = this._tourCard ? this._tourCard.offsetHeight : 230;
    const spaceBelow = innerHeight - (spot.y + spot.r + 18);
    const spaceAbove = spot.y - spot.r - 18;
    let cardTop;
    if (spaceBelow >= cardH + 14) cardTop = spot.y + spot.r + 18;
    else if (spaceAbove >= cardH + 14) cardTop = spot.y - spot.r - 18 - cardH;
    else cardTop = Math.max(14, Math.min(innerHeight - cardH - 14, spot.y - cardH / 2)); // no room either side: clamp on-screen
    const g = this.TOUR[step].g;
    return {
      tourOn: S.tour >= 0,
      tourOpen: () => this.setState({ tour: 0, drawer: null }),
      tourCardRef: el => { if (el) { this._tourCard = el; if (!this._tourMeasured) { this._tourMeasured = true; requestAnimationFrame(() => this.forceUpdate()); } } },
      spotX: spot.x.toFixed(0) + 'px', spotY: spot.y.toFixed(0) + 'px', spotD: (spot.r * 2).toFixed(0) + 'px',
      tapDisp: g === 'tap' ? 'block' : 'none', dragDisp: g === 'drag' ? 'block' : 'none',
      cardLeft: cardLeft.toFixed(0) + 'px', cardW: cardW + 'px',
      cardTop: cardTop.toFixed(0) + 'px',
      cardBottom: 'auto',
      tourStepNum: (step + 1) + '',
      tourTitle: this.TOUR[step].t,
      tourBody: this.TOUR[step].b,
      tourBtn: S.tour === 3 ? 'BEGIN' : 'NEXT',
      tourDots: this.TOUR.map((_, i) => ({ bg: i === S.tour ? '#d4a437' : 'rgba(247,242,232,.18)' })),
      tourNext: () => { if (S.tour >= 3) this.endTour(true); else this.setState({ tour: S.tour + 1 }); },
      tourSkip: () => this.endTour(false)
    };
  }
}
</script>
